# Keeps the Render free-tier backend awake and the archives filling.
#
# Render's free plan sleeps after ~15 idle minutes, and the archives
# (news_archive, cra_actions, source_reads) only grow when something reads the
# feeds. Without this, history accrues only while a BD has the tab open.
# /api/poll is throttled server-side to once per 10 minutes, so this cannot
# make the backend hammer NSE or the CRA sites.
#
# Public repo: Actions minutes are free. GitHub pauses scheduled workflows
# after 60 days without a commit - the nightly build keeps it active.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the backend and read every feed once
        run: |
          # A cold start takes ~50s; retry rather than fail on the first knock.
          curl -sS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
            https://acer-iq.onrender.com/api/poll | head -c 2000
