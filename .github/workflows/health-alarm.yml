# The alarm a human actually receives (PREMORTEM.md sections 2 and 8).
#
# Fails when /api/health reports anything in `degraded` - a source with no
# successful read for 48 hours, an archive not durable, an open circuit
# breaker - or when the backend does not answer at all. GitHub emails the repo
# owner on a failed scheduled run, so a dead scraper reaches an inbox instead
# of a log line nobody reads. Every 6 hours: often enough to catch a two-day
# outage early, rare enough not to become noise.
name: health-alarm

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check /api/health
        run: |
          body=$(curl -sS --retry 4 --retry-delay 20 --retry-all-errors --max-time 120 \
                 https://acer-iq.onrender.com/api/health) || { echo "::error::backend unreachable"; exit 1; }
          echo "$body" | python3 -c '
          import json, sys
          h = json.load(sys.stdin)
          for f in h.get("freshness", []):
              print("%10s  %s: %s" % (f.get("state"), f.get("source"), f.get("message")))
          bad = h.get("degraded", [])
          if bad:
              for d in bad:
                  print("::error::" + d)
              sys.exit(1)
          print("healthy")
          '
